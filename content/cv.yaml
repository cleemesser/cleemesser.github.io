publications:
  - group: "Current work"
    items:
      - title: "Latent-space topology, geometry, and dynamics: from competence monitoring to self-introspection"
        authors: ["Lee-Messer C"]
        venue: "in development"
        year: 2026
        note: >
          TRUST-LAPSE (Bhaskhar, 2024) used distances in latent space to flag
          inputs a model should not be trusted on. This work extends that idea
          from competence monitoring to model introspection, and then to
          self-introspective systems: one part of a model takes another part's
          latent space as its input and learns to predict it, in the manner of a
          JEPA-style world model.
      - title: "DCTOP: a decentralized clinical trial open platform for rare pediatric neurological disorders"
        authors: ["Lee-Messer C"]
        venue: "Platform in development"
        year: 2026
        note: >
          A mobile app, investigator web portal, and server that let families take part
          in a trial from home, with their local neurologist and telehealth visits in
          place of travel to a trial center. The analysis side uses simulation-based
          Bayesian designs suited to small rare-disease trials. First use: an
          investigator-initiated Phase IIa safety and tolerability study of nortriptyline
          in SYNGAP1-related disorder, funded by CureSyngap1.

