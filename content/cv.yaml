summary: >
  Neurologist-scientist studying the science of intelligence and the pathology of abnormal brain dynamics. Trained in physics, developmental and computational neuroscience, molecular biology, optogenic gene therapies, and clinical neurophysiology. Basic research studying the topology and metric geometry of learned latent spaces to better understand how neural networks function and as a route to safer, more
  interpretable models. Applied work building large medical databases of EEG, charts and brain MRI in order to build machine learning models for medical diagnosis. I am interested in research roles and collaborations on world models and non-linguistic intelligence, particularly where they meet real clinical data.

interests:
  - title: "World models of physiological signals"
    text: >
      EEG represents a continuous, high-dimensional, non-linguistic record of a
      dynamical system.  Modeling this dynamical system is fundamental to
      understanding the brain's function and its failure modes in the form of
      seizures and epilepsy. We are building dynamical systems models of the
      brain to diagnose epileptic brain circuits and identify areas for
      treatment. Predicting its future in latent representation space is a
      natural testbed for joint-embedding predictive architectures; our
      self-supervised EEG pre-training (ICLR 2022) have long used next-window
      prediction as its objective. We hypothesize that embedded spaces
      architectures will form efficient, non-linear sketches of the underlying
      dynamics that can surpass linear-system approaches.
  - title: "Latent space geometry for safety, introspection, and self-modeling"
    text: >
      TRUST-LAPSE (Bhaskhar, 2024) showed that understanding the underlying
      metric/quasi-metric structure in a neural network latent space allowed
      idenification of errors as they propagated through a neural network.
      trusted on. This structure provides a readable signal of the model's own
      competence. Current work asks which topological, geometric, and dynamical
      properties of a representation (metric, curvature, information geometry,
      trajectories through latent space) mark the edge of that competence, and
      how to measure them in deployment. The same measurements are a route to
      introspection: they show what a network represents and how that structure
      changes as it learns and runs. The next step is a self-introspective
      system, in which one part of a model takes another part's latent space as
      its input and learns to predict it.
  - title: "Neurodevelopment as inductive bias"
    text: >
      Before the eyes open, spontaneous retinal waves organize visual circuits through
      Hebbian learning. Activity-dependent development is a biological precedent for
      self-supervised pre-training on internally generated data, and a source of ideas
      for how intelligence arises without language.
  - title: "From charts and signals to clinical tools"
    text: >
      Clinical workflow notes, reports, and EEG annotations are abundant, noisy supervision.
      I have used weak supervision to train seizure detectors at scale, and I want to turn
      EEG, MRI, and the medical record into models clinicians and patients can rely on.

