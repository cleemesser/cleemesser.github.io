[project]
authors = [{name = "Christopher Lee-Messer", email = "chris@lee-messer.net"}]
dependencies = []
name = "cv-site"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
cv_site = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
jinja2 = ">=3.1"
pyyaml = ">=6.0"
"ruamel.yaml" = ">=0.19.1,<0.20"
markdown = ">=3.5"
